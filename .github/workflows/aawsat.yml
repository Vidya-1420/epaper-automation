name: Aawsat E-Paper Automation

on:
  workflow_dispatch:

jobs:
  download-epaper:
    runs-on: ubuntu-latest

    env:
      SFTP_HOST: 127.0.0.1
      SFTP_PORT: 2222
      SFTP_USERNAME: testuser
      SFTP_PASSWORD: testpass
      SFTP_REMOTE_PATH: /upload
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_PORT: 587
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start test SFTP server
        run: |
          docker run -d \
            --name test-sftp \
            -p 2222:22 \
            atmoz/sftp \
            testuser:testpass:::upload
          sleep 5

      - name: Run Aawsat automation
        run: python main.py

      - name: Check uploaded files
        run: |
          docker exec test-sftp find /home/testuser/upload -type f -ls
